min_version = "2024.11.1"

[tools]
go = "1.24.5"
golangci-lint = "2.8.0"
syft = "1.41.2"
trivy = "0.69.1"

[tasks.build]
description = "Build the binary"
run = "go build -o bin/netmon ./cmd/netmon/"
sources = ["**/*.go", "go.mod", "go.sum"]
outputs = ["bin/netmon"]

[tasks.run]
description = "Build and run"
run = "go run ./cmd/netmon/"

[tasks.test]
description = "Run all tests"
run = "go test -v -race -coverprofile=coverage.out ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.fmt]
description = "Format code"
run = "gofmt -w ."

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.clean]
description = "Remove build artifacts"
run = "rm -rf bin/ coverage.out coverage.html"

[tasks.coverage]
description = "Generate HTML coverage report"
run = """
go test -coverprofile=coverage.out ./...
go tool cover -html=coverage.out -o coverage.html
"""

[tasks.setup]
description = "Install tools and download dependencies"
run = """
mise install
go mod download
"""

[tasks.vuln]
description = "Scan for vulnerabilites"
run = """
trivy fs --severity HIGH,CRITICAL --exit-code 1 .
"""

[tasks.sbom]
description = "Generate SBOM"
run = """
syft scan . -o spdx-json=sbom.spdx.json --source-name netmon --source-version dev
"""

[tasks.'bootstrap-github']
description = "Bootstraps the GitHub repo wth the appropriate settings"
run = """
chmod +x ./.github/settings/enable-security.sh
./.github/settings/enable-security.sh
"""
