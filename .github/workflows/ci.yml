name: CI

on:
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    permissions:
      contents: write # Required for dependency-snapshot submission (SBOM)
      security-events: write # Required for sarif upload (Trivy)
    steps:
      - uses: actions/checkout@v4

      - name: Upload SARIF for annotations
        if: always()
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'


      - name: Generate SBOM
        uses: anchore/sbom-action@v0.22.2
        with:
          path: .
          dependency-snapshot: true # Submit to GitHub for Dependabot
          # artifact-name: sbom.spdx.json

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      - name: Install tools
        run: mise install

      - name: Build
        run: go build -o bin/netmon ./cmd/netmon/

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      - name: Install tools
        run: mise install

      - name: Test
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v3

      - name: Install tools
        run: mise install

      - name: Run linting
        run: mise run lint
